<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>음성 → 텍스트 → 영어 번역 → 음성 출력</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 16px; background: #0f1115; color: #e8eaed;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 1020px; }
  h1 { font-size: 18px; margin: 0 0 14px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .controls.sub { padding-top: 10px; border-top: 1px solid #242a34; margin-bottom: 14px; }
  button {
    padding: 11px 18px; border: 0; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; background: #2b6cf6; color: #fff;
  }
  button.stop { background: #d93b3b; }
  button.ghost { background: #2a2f3a; color: #cfd4dc; }
  button.sm { padding: 8px 12px; font-size: 13px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select {
    padding: 10px; border-radius: 8px; border: 1px solid #333a47;
    background: #1a1e26; color: #e8eaed; font-size: 14px; max-width: 230px;
  }
  label.chk { font-size: 13px; color: #aab2bf; display: flex; align-items: center; gap: 6px; }
  .rng { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aab2bf; }
  input[type=range] { width: 92px; accent-color: #2b6cf6; }
  .tag { font-size: 11px; color: #6d7582; letter-spacing: .05em; text-transform: uppercase; }
  #status { font-size: 13px; margin-bottom: 12px; color: #8d96a3; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: #35c759; animation: pulse 1.1s infinite; }
  .dot.speak { background: #f0a030; animation: pulse .8s infinite; }
  .dot.hold { background: #6d7582; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .mic { font-size: 11px; color: #5c6personal; }
  #micState { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: #2a2f3a; color: #8d96a3; }
  #micState.live { background: #16321f; color: #6fdc8c; }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 {
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: #7f8795; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px;
  }
  .box {
    width: 100%; min-height: 180px; padding: 12px 16px;
    background: #1a1e26; border: 1px solid #2b313c; border-radius: 10px;
    font-size: 16px; line-height: 1.75; word-break: break-word;
    overflow-y: auto; max-height: 40vh; -webkit-overflow-scrolling: touch;
  }
  .box.trans { border-color: #2f4a6b; background: #161d26; }
  .interim { color: #7f8795; font-style: italic; }
  .pending { color: #6d7582; }
  .line { display: block; margin-bottom: 5px; }
  .line.speaking { background: #2a3a52; border-radius: 5px; box-shadow: 0 0 0 4px #2a3a52; }
  .play {
    display: inline-block; cursor: pointer; color: #5a85c9;
    margin-right: 7px; font-size: 15px; user-select: none; padding: 2px 4px;
  }
  .banner { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; display: none; line-height: 1.6; }
  .banner.err  { background: #3a1f22; border: 1px solid #6b2c31; color: #ffb4b4; }
  .banner.warn { background: #3a331f; border: 1px solid #6b5c2c; color: #ffe2a8; }
  .banner.info { background: #1b2a3a; border: 1px solid #2f4a6b; color: #a8cdff; }
  #bar { height: 4px; background: #2a2f3a; border-radius: 3px; overflow: hidden; display: none; margin-bottom: 12px; }
  #bar > i { display: block; height: 100%; width: 0%; background: #2b6cf6; transition: width .2s; }
  code { background: #11151c; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>음성 → 텍스트 → 영어 번역 → 음성 출력</h1>

  <div class="banner err"  id="err"></div>
  <div class="banner warn" id="warn"></div>
  <div class="banner info" id="info"></div>
  <div id="bar"><i id="barFill"></i></div>

  <div class="controls">
    <span class="tag">입력</span>
    <button id="startBtn">녹음 시작</button>
    <button id="stopBtn" class="stop" disabled>중지</button>
    <button id="clearBtn" class="ghost">지우기</button>
    <select id="lang">
      <option value="ko-KR" data-code="ko">한국어</option>
      <option value="ja-JP" data-code="ja">日本語</option>
      <option value="zh-CN" data-code="zh">中文</option>
      <option value="es-ES" data-code="es">Español</option>
    </select>
    <label class="chk"><input type="checkbox" id="auto" checked> 연속 인식</label>
    <label class="chk"><input type="checkbox" id="doTrans" checked> 영어 번역</label>
  </div>

  <div class="controls sub">
    <span class="tag">음성 출력</span>
    <label class="chk"><input type="checkbox" id="autoSpeak" checked> 자동 읽기</label>
    <select id="voice"><option>음성 로딩 중…</option></select>
    <span class="rng">속도 <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><b id="rateV">1.0</b></span>
    <span class="rng">음높이 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><b id="pitchV">1.0</b></span>
    <button id="speakAllBtn" class="ghost sm">전체 듣기</button>
    <button id="ttsStopBtn" class="ghost sm">읽기 중지</button>
    <button id="copyBtn" class="ghost sm">번역문 복사</button>
  </div>

  <div id="status">
    <span class="dot" id="dot"></span><span id="statusText">대기 중</span>
    <span id="micState">마이크 꺼짐</span>
  </div>

  <div class="panes">
    <div class="pane">
      <h2><span>원문 (음성 인식)</span><span id="count">0자</span></h2>
      <div class="box" id="srcBox"></div>
    </div>
    <div class="pane">
      <h2><span>영어 번역 (▶ 터치하면 재생)</span><span id="engine">—</span></h2>
      <div class="box trans" id="dstBox"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const SR  = window.SpeechRecognition || window.webkitSpeechRecognition;
  const TTS = window.speechSynthesis;
  const $ = id => document.getElementById(id);
  const srcBox = $('srcBox'), dstBox = $('dstBox');

  const UA = navigator.userAgent;
  const IS_IOS     = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const IS_ANDROID = /Android/.test(UA);
  const IS_MOBILE  = IS_IOS || IS_ANDROID;

  let recog = null, recognizing = false, manualStop = false, sessionOn = false;
  let segments = [];
  let translator = null, translatorLang = null;
  let transQueue = Promise.resolve();
  let speakingIdx = -1, voices = [], ttsQueue = [], ttsBusy = false;
  let ttsUnlocked = false, wakeLock = null;
  let engineMode = null;

  // ★★ 핵심: 세션 동안 절대 놓지 않는 마이크 스트림 ★★
  let micStream = null;
  let suppressUntil = 0;          // 이 시각 이전 결과는 에코로 간주해 버림
  let startingRecog = false;

  const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  const banner = (el, msg) => { el.style.display = 'block'; el.innerHTML = msg; };
  function setStatus(t, mode) {
    $('statusText').textContent = t;
    $('dot').className = 'dot' + (mode ? ' ' + mode : '');
  }
  function setMicState(on) {
    const el = $('micState');
    el.textContent = on ? '마이크 점유 중 (권한 유지)' : '마이크 꺼짐';
    el.className = on ? 'live' : '';
  }

  function render(interim) {
    srcBox.innerHTML =
      segments.map(s => '<span class="line">' + esc(s.src) + '</span>').join('') +
      (interim ? '<span class="interim">' + esc(interim) + '</span>' : '');
    dstBox.innerHTML = segments.map((s, i) => {
      const cls = 'line' + (i === speakingIdx ? ' speaking' : '');
      if (s.state === 'done')
        return '<span class="' + cls + '"><span class="play" data-i="' + i + '">▶</span>' + esc(s.dst) + '</span>';
      if (s.state === 'fail') return '<span class="line pending">[번역 실패] ' + esc(s.src) + '</span>';
      return '<span class="line pending">번역 중…</span>';
    }).join('');
    srcBox.scrollTop = srcBox.scrollHeight;
    dstBox.scrollTop = dstBox.scrollHeight;
    $('count').textContent = segments.reduce((a, s) => a + s.src.length, 0) + '자';
  }

  /* ========== 환경 점검 ========== */
  if (!SR) {
    banner($('err'), IS_IOS
      ? '<b>iOS 크롬/사파리는 Web Speech 음성 인식을 지원하지 않습니다.</b><br>안드로이드 크롬 또는 PC 크롬을 사용해주세요.'
      : '이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome 또는 Edge에서 열어주세요.');
    $('startBtn').disabled = true;
  }
  const SECURE = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!SECURE) {
    banner($('err'),
      '<b>보안 컨텍스트가 아닙니다 — 이것이 권한 반복 요청의 가장 흔한 원인입니다.</b><br>' +
      '<code>http://</code> 나 <code>file://</code> 로 열면 브라우저가 마이크 허용을 <b>기억하지 못해</b> 매번 다시 묻습니다. ' +
      '반드시 <code>https://</code> 주소로 접속하세요.');
  }

  /* ========== 권한 상태 감시 ========== */
  async function checkPermission() {
    try {
      if (!navigator.permissions || !navigator.permissions.query) return null;
      const st = await navigator.permissions.query({ name: 'microphone' });
      if (st.state === 'prompt' && IS_MOBILE) {
        banner($('info'),
          '<b>마이크 권한이 “이번만 허용” 상태일 수 있습니다.</b><br>' +
          '크롬 주소창 왼쪽 <b>자물쇠/설정 아이콘 → 권한 → 마이크 → 허용</b> 으로 고정해두면 다시 묻지 않습니다.');
      }
      st.onchange = () => { if (st.state === 'denied') banner($('err'), '마이크 권한이 거부되었습니다. 사이트 권한에서 허용으로 변경해주세요.'); };
      return st.state;
    } catch (_) { return null; }
  }

  /* ========== 마이크 스트림: 한 번만 얻고 세션 내내 유지 ========== */
  async function acquireMic() {
    if (micStream && micStream.getAudioTracks().some(t => t.readyState === 'live')) return micStream;
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,     // 스피커 출력이 마이크로 되돌아오는 것 억제
        noiseSuppression: true,
        autoGainControl: true
      }
    });
    // 기기 분리 등으로 트랙이 끝나면 세션 정리
    micStream.getAudioTracks().forEach(t => {
      t.onended = () => { setMicState(false); };
    });
    setMicState(true);
    return micStream;
  }
  function releaseMic() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    setMicState(false);
  }
  // TTS 중에는 트랙을 "정지"하지 않고 "음소거"만 → 권한/점유 유지
  function muteMic(on) {
    if (!micStream) return;
    micStream.getAudioTracks().forEach(t => { t.enabled = !on; });
  }

  /* ================= TTS ================= */
  function loadVoices() {
    if (!TTS) return;
    const all = TTS.getVoices();
    let list = all.filter(v => /^en(-|_|$)/i.test(v.lang));
    if (!list.length) list = all;
    if (!list.length) return;
    voices = list;
    const sel = $('voice');
    const cur = sel.value;
    sel.innerHTML = voices.map((v, i) =>
      '<option value="' + i + '">' + v.name + ' (' + v.lang + ')' + (v.localService ? ' · 로컬' : '') + '</option>'
    ).join('');
    const pref = voices.findIndex(v => /natural|google|samantha|aria/i.test(v.name));
    sel.value = (cur && voices[cur]) ? cur : (pref >= 0 ? pref : 0);
  }
  if (TTS) {
    loadVoices();
    TTS.onvoiceschanged = loadVoices;
    let tries = 0;
    const iv = setInterval(() => { loadVoices(); if (voices.length || ++tries > 20) clearInterval(iv); }, 250);
  } else {
    banner($('warn'), '이 브라우저는 음성 합성(speechSynthesis)을 지원하지 않습니다.');
  }

  function unlockTTS() {
    if (ttsUnlocked || !TTS) return;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.lang = 'en-US';
      TTS.speak(u);
      ttsUnlocked = true;
    } catch (_) {}
  }

  function speak(idx) {
    if (!TTS || !segments[idx] || segments[idx].state !== 'done') return;
    ttsQueue.push(idx);
    pumpTTS();
  }

  function pumpTTS() {
    if (ttsBusy || !ttsQueue.length) return;
    const idx = ttsQueue.shift();
    const seg = segments[idx];
    if (!seg || !seg.dst) return pumpTTS();

    ttsBusy = true;
    speakingIdx = idx;

    // ★ 더 이상 recog.abort() 하지 않음. 인식기는 계속 살아있고, 입력만 무시 + 마이크 음소거
    muteMic(true);

    const u = new SpeechSynthesisUtterance(seg.dst);
    const v = voices[$('voice').value];
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate  = parseFloat($('rate').value);
    u.pitch = parseFloat($('pitch').value);

    let done = false;
    const finish = () => {
      if (done) return; done = true;
      clearTimeout(guard);
      ttsBusy = false;
      speakingIdx = -1;
      suppressUntil = Date.now() + 450;   // 잔향 구간 결과 버리기
      muteMic(false);
      render('');
      if (ttsQueue.length) { setTimeout(pumpTTS, 80); return; }
      if (sessionOn && !manualStop) {
        // 인식기가 살아있으면 그대로 계속, 죽었을 때만 재시작
        if (recognizing) setStatus('듣는 중…', 'on');
        else setTimeout(startRecognition, 200);
      } else {
        setStatus('대기 중', '');
      }
    };

    u.onstart = () => { setStatus('읽는 중…', 'speak'); render(''); };
    u.onend   = finish;
    u.onerror = finish;

    const guard = setTimeout(finish, Math.max(4000, seg.dst.length * 120));

    TTS.cancel();
    setTimeout(() => { try { TTS.speak(u); } catch (_) { finish(); } }, 120);
  }

  function stopSpeaking() {
    ttsQueue = [];
    if (TTS) TTS.cancel();
    ttsBusy = false; speakingIdx = -1;
    suppressUntil = Date.now() + 300;
    muteMic(false);
    render('');
    if (sessionOn && !manualStop && !recognizing) setTimeout(startRecognition, 200);
    else if (sessionOn) setStatus('듣는 중…', 'on');
  }

  dstBox.addEventListener('click', e => {
    const t = e.target.closest('.play');
    if (t) { unlockTTS(); stopSpeaking(); speak(parseInt(t.dataset.i, 10)); }
  });

  /* ============== 번역: 내장 → 원격 폴백 ============== */
  function builtinAPI() {
    if (typeof Translator !== 'undefined' && Translator.availability) return Translator;
    if (self.ai && self.ai.translator) return self.ai.translator;
    return null;
  }

  async function ensureBuiltin(srcCode) {
    if (translator && translatorLang === srcCode) return translator;
    const API = builtinAPI();
    if (!API) throw new Error('UNSUPPORTED');
    const opts = { sourceLanguage: srcCode, targetLanguage: 'en' };
    const avail = await API.availability(opts);
    if (avail === 'unavailable') throw new Error('UNAVAILABLE');
    if (avail !== 'available') { $('bar').style.display = 'block'; setStatus('번역 모델 다운로드 중…', ''); }
    translator = await API.create({
      ...opts,
      monitor(m) {
        m.addEventListener('downloadprogress', e => {
          $('barFill').style.width = Math.round((e.loaded || 0) * 100) + '%';
        });
      }
    });
    $('bar').style.display = 'none';
    translatorLang = srcCode;
    return translator;
  }

  async function fetchJSON(url, ms) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), ms || 8000);
    try {
      const r = await fetch(url, { signal: ac.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  const REMOTES = [
    { name: 'google', async run(text, src) {
        const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl='
          + encodeURIComponent(src) + '&tl=en&dt=t&q=' + encodeURIComponent(text);
        const j = await fetchJSON(u);
        const out = (j[0] || []).map(p => p[0]).join('');
        if (!out) throw new Error('empty');
        return out;
      } },
    { name: 'mymemory', async run(text, src) {
        const u = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text)
          + '&langpair=' + encodeURIComponent(src) + '|en';
        const j = await fetchJSON(u);
        const out = j && j.responseData && j.responseData.translatedText;
        if (!out) throw new Error('empty');
        return out;
      } },
    { name: 'lingva', async run(text, src) {
        const u = 'https://lingva.ml/api/v1/' + encodeURIComponent(src) + '/en/' + encodeURIComponent(text);
        const j = await fetchJSON(u);
        if (!j.translation) throw new Error('empty');
        return j.translation;
      } }
  ];
  let remoteOrder = REMOTES.slice();

  async function remoteTranslate(text, src) {
    let lastErr;
    for (let i = 0; i < remoteOrder.length; i++) {
      const p = remoteOrder[i];
      try {
        const out = await p.run(text, src);
        remoteOrder = [p].concat(remoteOrder.filter(x => x !== p));
        $('engine').textContent = '원격 ' + p.name + ' ' + src + '→en';
        return out;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('REMOTE_FAIL');
  }

  async function translateText(text, srcCode) {
    if (engineMode !== 'remote') {
      try {
        const t = await ensureBuiltin(srcCode);
        engineMode = 'builtin';
        $('engine').textContent = '내장 ' + srcCode + '→en';
        return await t.translate(text);
      } catch (e) {
        $('bar').style.display = 'none';
        engineMode = 'remote';
        banner($('info'),
          '<b>내장 번역 모델이 없어 원격 번역으로 전환했습니다.</b><br>' +
          (IS_MOBILE ? '모바일 크롬에는 Chrome 내장 Translator API가 없습니다. 인터넷 연결이 필요합니다.' : '인터넷 연결이 필요합니다.'));
      }
    }
    return await remoteTranslate(text, srcCode);
  }

  function enqueueTranslate(seg, srcCode) {
    transQueue = transQueue.then(async () => {
      try {
        seg.dst = await translateText(seg.src, srcCode);
        seg.state = 'done';
        render('');
        if ($('autoSpeak').checked) speak(segments.indexOf(seg));
      } catch (e) {
        seg.state = 'fail';
        $('engine').textContent = '번역 실패';
        banner($('warn'), '<b>번역에 실패했습니다.</b><br>네트워크 상태를 확인해주세요.');
        render('');
      }
    });
  }

  /* ================= 음성 인식 ================= */
  function createRecognition() {
    const r = new SR();
    r.lang = $('lang').value;
    r.continuous = $('auto').checked;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      recognizing = true; startingRecog = false;
      if (!ttsBusy) setStatus('듣는 중…', 'on');
    };

    r.onresult = e => {
      if (ttsBusy || Date.now() < suppressUntil) return;   // 에코 차단
      const srcCode = $('lang').selectedOptions[0].dataset.code;
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = (e.results[i][0].transcript || '').trim();
        if (e.results[i].isFinal) {
          if (!txt) continue;
          const seg = { src: txt, dst: '', state: 'pending' };
          segments.push(seg);
          if ($('doTrans').checked) enqueueTranslate(seg, srcCode);
          else {
            seg.dst = txt; seg.state = 'done';
            if ($('autoSpeak').checked) speak(segments.length - 1);
          }
        } else interim += e.results[i][0].transcript;
      }
      render(interim);
    };

    r.onerror = e => {
      if (['no-speech', 'aborted'].includes(e.error)) return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        sessionOn = false; releaseMic();
        $('startBtn').disabled = false; $('stopBtn').disabled = true;
      }
      banner($('err'), ({
        'not-allowed': '마이크 권한이 거부되었습니다. 주소창 왼쪽 아이콘 → 권한 → 마이크 → <b>허용</b> 으로 고정해주세요.',
        'service-not-allowed': '음성 인식 서비스가 차단되었습니다. 시스템 설정을 확인해주세요.',
        'audio-capture': '마이크 장치를 찾을 수 없습니다.',
        'network': '음성 인식 네트워크 오류입니다.'
      })[e.error] || ('오류: ' + e.error));
    };

    r.onend = () => {
      recognizing = false; startingRecog = false;
      if (ttsBusy) return;                       // 재생 끝나면 finish()가 처리
      if (!manualStop && sessionOn && $('auto').checked) {
        // 마이크 스트림은 그대로 살아있으므로 권한 재요청 없이 즉시 재개
        setTimeout(startRecognition, 150);
        return;
      }
      setStatus('대기 중', '');
      $('startBtn').disabled = false;
      $('stopBtn').disabled = true;
    };
    return r;
  }

  function startRecognition() {
    if (recognizing || startingRecog || ttsBusy || !sessionOn) return;
    startingRecog = true;
    recog = createRecognition();
    try { recog.start(); }
    catch (_) {
      startingRecog = false;
      setTimeout(() => { if (!recognizing && sessionOn) startRecognition(); }, 400);
    }
  }

  /* ========== 화면 꺼짐 방지 ========== */
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (_) {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && sessionOn) {
      requestWakeLock();
      if (!recognizing && !ttsBusy) startRecognition();
    }
  });

  /* ================= 버튼 ================= */
  $('startBtn').onclick = async () => {
    $('err').style.display = 'none';
    manualStop = false; sessionOn = true;

    unlockTTS();
    if (TTS) loadVoices();
    requestWakeLock();
    checkPermission();

    // ★ 여기서 딱 한 번만 권한 요청. 이후 세션 내내 스트림을 놓지 않음
    try {
      await acquireMic();
    } catch (err) {
      sessionOn = false; releaseWakeLock();
      banner($('err'),
        '<b>마이크를 사용할 수 없습니다.</b> (' + (err && err.name ? err.name : 'error') + ')<br>' +
        '브라우저 사이트 권한에서 마이크를 <b>허용</b> 으로 설정해주세요.');
      return;
    }

    if ($('doTrans').checked) {
      try { await ensureBuiltin($('lang').selectedOptions[0].dataset.code); engineMode = 'builtin'; }
      catch (_) { engineMode = 'remote'; $('engine').textContent = '원격 대기'; }
    }

    startRecognition();
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
  };

  $('stopBtn').onclick = () => {
    manualStop = true; sessionOn = false;
    ttsQueue = []; if (TTS) TTS.cancel();
    ttsBusy = false; speakingIdx = -1;
    if (recog) { try { recog.stop(); } catch (_) {} }
    releaseMic();                // 세션 종료 시에만 마이크 해제
    releaseWakeLock();
    $('stopBtn').disabled = true;
    $('startBtn').disabled = false;
    setStatus('중지됨', '');
    render('');
  };

  $('clearBtn').onclick = () => { stopSpeaking(); segments = []; render(''); };

  $('rate').oninput  = e => $('rateV').textContent  = parseFloat(e.target.value).toFixed(1);
  $('pitch').oninput = e => $('pitchV').textContent = parseFloat(e.target.value).toFixed(1);

  $('speakAllBtn').onclick = () => {
    unlockTTS(); stopSpeaking();
    segments.forEach((s, i) => { if (s.state === 'done') ttsQueue.push(i); });
    pumpTTS();
  };
  $('ttsStopBtn').onclick = stopSpeaking;

  $('copyBtn').onclick = async () => {
    const text = segments.filter(s => s.state === 'done').map(s => s.dst).join('\n');
    if (!text) return;
    try { await navigator.clipboard.writeText(text); }
    catch (_) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (__) {}
      document.body.removeChild(ta);
    }
    $('copyBtn').textContent = '복사됨!';
    setTimeout(() => $('copyBtn').textContent = '번역문 복사', 1200);
  };

  $('lang').onchange = () => {
    translator = null; translatorLang = null;
    if (engineMode === 'builtin') engineMode = null;
    $('engine').textContent = '—';
    // 언어만 바꿔 재시작 (마이크는 유지)
    if (recognizing && recog) { try { recog.stop(); } catch (_) {} }
  };

  window.addEventListener('beforeunload', () => { if (TTS) TTS.cancel(); releaseMic(); releaseWakeLock(); });

  if (!builtinAPI()) {
    $('engine').textContent = IS_MOBILE ? '원격 사용' : '원격 대기';
    banner($('info'),
      IS_MOBILE
        ? '<b>모바일 크롬에는 내장 번역 모델이 없어 원격 번역 API를 사용합니다.</b><br>인터넷 연결이 필요합니다.'
        : '<b>내장 번역 모델이 감지되지 않아 원격 번역으로 동작합니다.</b><br>' +
          'Chrome 138+ 에서 <code>chrome://flags/#translation-api</code> → <b>Enabled</b> 후 재시작하면 내장 번역을 쓸 수 있습니다.');
  }
})();
</script>
</body>
</html>
