<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 → 텍스트 → 영어 번역 → 음성 출력</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 24px; background: #0f1115; color: #e8eaed;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 1020px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .controls.sub { padding-top: 10px; border-top: 1px solid #242a34; margin-bottom: 14px; }
  button {
    padding: 10px 18px; border: 0; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; background: #2b6cf6; color: #fff;
  }
  button.stop { background: #d93b3b; }
  button.ghost { background: #2a2f3a; color: #cfd4dc; }
  button.sm { padding: 7px 12px; font-size: 13px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select {
    padding: 9px 10px; border-radius: 8px; border: 1px solid #333a47;
    background: #1a1e26; color: #e8eaed; font-size: 14px; max-width: 230px;
  }
  label.chk { font-size: 13px; color: #aab2bf; display: flex; align-items: center; gap: 6px; }
  .rng { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aab2bf; }
  input[type=range] { width: 92px; accent-color: #2b6cf6; }
  .tag { font-size: 11px; color: #6d7582; letter-spacing: .05em; text-transform: uppercase; }
  #status { font-size: 13px; margin-bottom: 12px; color: #8d96a3; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: #35c759; animation: pulse 1.1s infinite; }
  .dot.speak { background: #f0a030; animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 {
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: #7f8795; margin: 0 0 6px; display: flex; justify-content: space-between;
  }
  .box {
    width: 100%; min-height: 300px; padding: 12px 16px;
    background: #1a1e26; border: 1px solid #2b313c; border-radius: 10px;
    font-size: 16px; line-height: 1.75; word-break: break-word;
    overflow-y: auto; max-height: 56vh;
  }
  .box.trans { border-color: #2f4a6b; background: #161d26; }
  .interim { color: #7f8795; font-style: italic; }
  .pending { color: #6d7582; }
  .line { display: block; margin-bottom: 5px; }
  .line.speaking { background: #2a3a52; border-radius: 5px; box-shadow: 0 0 0 4px #2a3a52; }
  .play {
    display: inline-block; cursor: pointer; color: #5a85c9;
    margin-right: 7px; font-size: 13px; user-select: none;
  }
  .play:hover { color: #8fb4ec; }
  .banner { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; display: none; line-height: 1.6; }
  .banner.err  { background: #3a1f22; border: 1px solid #6b2c31; color: #ffb4b4; }
  .banner.warn { background: #3a331f; border: 1px solid #6b5c2c; color: #ffe2a8; }
  #bar { height: 4px; background: #2a2f3a; border-radius: 3px; overflow: hidden; display: none; margin-bottom: 12px; }
  #bar > i { display: block; height: 100%; width: 0%; background: #2b6cf6; transition: width .2s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>음성 → 텍스트 → 영어 번역 → 음성 출력</h1>

  <div class="banner err"  id="err"></div>
  <div class="banner warn" id="warn"></div>
  <div id="bar"><i id="barFill"></i></div>

  <div class="controls">
    <span class="tag">입력</span>
    <button id="startBtn">녹음 시작</button>
    <button id="stopBtn" class="stop" disabled>중지</button>
    <button id="clearBtn" class="ghost">지우기</button>
    <select id="lang">
      <option value="ko-KR" data-code="ko">한국어</option>
      <option value="ja-JP" data-code="ja">日本語</option>
      <option value="zh-CN" data-code="zh">中文</option>
      <option value="es-ES" data-code="es">Español</option>
    </select>
    <label class="chk"><input type="checkbox" id="auto" checked> 연속 인식</label>
    <label class="chk"><input type="checkbox" id="doTrans" checked> 영어 번역</label>
  </div>

  <div class="controls sub">
    <span class="tag">음성 출력</span>
    <label class="chk"><input type="checkbox" id="autoSpeak" checked> 자동 읽기</label>
    <select id="voice"><option>음성 로딩 중…</option></select>
    <span class="rng">속도 <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><b id="rateV">1.0</b></span>
    <span class="rng">음높이 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><b id="pitchV">1.0</b></span>
    <button id="speakAllBtn" class="ghost sm">전체 듣기</button>
    <button id="ttsStopBtn" class="ghost sm">읽기 중지</button>
    <button id="copyBtn" class="ghost sm">번역문 복사</button>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="statusText">대기 중</span></div>

  <div class="panes">
    <div class="pane">
      <h2><span>원문 (음성 인식)</span><span id="count">0자</span></h2>
      <div class="box" id="srcBox"></div>
    </div>
    <div class="pane">
      <h2><span>영어 번역 (클릭하면 재생)</span><span id="engine">—</span></h2>
      <div class="box trans" id="dstBox"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const TTS = window.speechSynthesis;
  const $ = id => document.getElementById(id);
  const srcBox = $('srcBox'), dstBox = $('dstBox');

  let recog = null, recognizing = false, manualStop = false, sessionOn = false;
  let segments = [];            // { src, dst, state }
  let translator = null, translatorLang = null;
  let transQueue = Promise.resolve();
  let speakingIdx = -1, voices = [], ttsQueue = [], ttsBusy = false;

  const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  const banner = (el, msg) => { el.style.display = 'block'; el.innerHTML = msg; };
  function setStatus(t, mode) {
    $('statusText').textContent = t;
    $('dot').className = 'dot' + (mode ? ' ' + mode : '');
  }

  function render(interim) {
    srcBox.innerHTML =
      segments.map(s => '<span class="line">' + esc(s.src) + '</span>').join('') +
      (interim ? '<span class="interim">' + esc(interim) + '</span>' : '');
    dstBox.innerHTML = segments.map((s, i) => {
      const cls = 'line' + (i === speakingIdx ? ' speaking' : '');
      if (s.state === 'done')
        return '<span class="' + cls + '"><span class="play" data-i="' + i + '">▶</span>' + esc(s.dst) + '</span>';
      if (s.state === 'fail') return '<span class="line pending">[번역 실패]</span>';
      return '<span class="line pending">번역 중…</span>';
    }).join('');
    srcBox.scrollTop = srcBox.scrollHeight;
    dstBox.scrollTop = dstBox.scrollHeight;
    $('count').textContent = segments.reduce((a, s) => a + s.src.length, 0) + '자';
  }

  if (!SR) {
    banner($('err'), '이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome 또는 Edge에서 열어주세요.');
    $('startBtn').disabled = true;
    return;
  }

  /* ================= TTS ================= */
  function loadVoices() {
    if (!TTS) return;
    voices = TTS.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    if (!voices.length) return;
    const sel = $('voice');
    sel.innerHTML = voices.map((v, i) =>
      '<option value="' + i + '">' + v.name + ' (' + v.lang + ')' + (v.localService ? ' · 로컬' : '') + '</option>'
    ).join('');
    // 자연스러운 음성 우선 선택
    const pref = voices.findIndex(v => /natural|google|samantha|aria/i.test(v.name));
    sel.value = pref >= 0 ? pref : 0;
  }
  if (TTS) { loadVoices(); TTS.onvoiceschanged = loadVoices; }
  else banner($('warn'), '이 브라우저는 음성 합성(speechSynthesis)을 지원하지 않습니다.');

  function speak(idx) {
    if (!TTS || !segments[idx] || segments[idx].state !== 'done') return;
    ttsQueue.push(idx);
    pumpTTS();
  }

  function pumpTTS() {
    if (ttsBusy || !ttsQueue.length) return;
    const idx = ttsQueue.shift();
    const seg = segments[idx];
    if (!seg || !seg.dst) return pumpTTS();

    ttsBusy = true;
    speakingIdx = idx;

    // ── 에코 방지: 읽는 동안 마이크 인식을 일시 중단
    const wasListening = recognizing;
    if (wasListening && recog) { try { recog.abort(); } catch (_) {} }

    const u = new SpeechSynthesisUtterance(seg.dst);
    const v = voices[$('voice').value];
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = parseFloat($('rate').value);
    u.pitch = parseFloat($('pitch').value);

    const finish = () => {
      ttsBusy = false;
      speakingIdx = -1;
      render('');
      if (ttsQueue.length) { pumpTTS(); return; }
      // 세션이 살아있으면 마이크 재개
      if (sessionOn && !manualStop) restartRecognition();
      else setStatus(sessionOn ? '듣는 중…' : '대기 중', sessionOn ? 'on' : '');
    };

    u.onstart = () => { setStatus('읽는 중…', 'speak'); render(''); };
    u.onend = finish;
    u.onerror = finish;

    // Chrome 버그 회피: 긴 공백 후 첫 호출이 무시되는 경우
    TTS.cancel();
    setTimeout(() => TTS.speak(u), 60);
  }

  function stopSpeaking() {
    ttsQueue = [];
    if (TTS) TTS.cancel();
    ttsBusy = false; speakingIdx = -1;
    render('');
    if (sessionOn && !manualStop) restartRecognition();
  }

  dstBox.addEventListener('click', e => {
    const t = e.target.closest('.play');
    if (t) { stopSpeaking(); speak(parseInt(t.dataset.i, 10)); }
  });

  $('rate').oninput  = e => $('rateV').textContent  = parseFloat(e.target.value).toFixed(1);
  $('pitch').oninput = e => $('pitchV').textContent = parseFloat(e.target.value).toFixed(1);
  $('speakAllBtn').onclick = () => {
    stopSpeaking();
    segments.forEach((s, i) => { if (s.state === 'done') ttsQueue.push(i); });
    pumpTTS();
  };
  $('ttsStopBtn').onclick = stopSpeaking;

  /* ============== 번역 (내장 Translator API) ============== */
  function translatorAPI() {
    if (typeof Translator !== 'undefined') return Translator;
    if (self.ai && self.ai.translator) return self.ai.translator;
    return null;
  }

  async function ensureTranslator(srcCode) {
    if (translator && translatorLang === srcCode) return translator;
    const API = translatorAPI();
    if (!API) throw new Error('UNSUPPORTED');
    const opts = { sourceLanguage: srcCode, targetLanguage: 'en' };
    const avail = await API.availability(opts);
    if (avail === 'unavailable') throw new Error('UNAVAILABLE');
    if (avail !== 'available') { $('bar').style.display = 'block'; setStatus('번역 모델 다운로드 중…', ''); }
    translator = await API.create({
      ...opts,
      monitor(m) {
        m.addEventListener('downloadprogress', e => {
          $('barFill').style.width = Math.round((e.loaded || 0) * 100) + '%';
        });
      }
    });
    $('bar').style.display = 'none';
    translatorLang = srcCode;
    $('engine').textContent = '내장 ' + srcCode + '→en';
    return translator;
  }

  function enqueueTranslate(seg, srcCode) {
    transQueue = transQueue.then(async () => {
      try {
        const t = await ensureTranslator(srcCode);
        seg.dst = await t.translate(seg.src);
        seg.state = 'done';
        render('');
        if ($('autoSpeak').checked) speak(segments.indexOf(seg));   // ← 번역 완료 즉시 읽기
      } catch (e) {
        seg.state = 'fail';
        if (e.message === 'UNSUPPORTED') {
          $('doTrans').checked = false;
          $('engine').textContent = '사용 불가';
          banner($('warn'),
            '<b>브라우저 내장 번역 모델을 쓸 수 없습니다.</b><br>' +
            'Chrome 138 이상에서 <code>chrome://flags/#translation-api</code> 를 <b>Enabled</b> 로 바꾸고 재시작해 보세요. ' +
            '(음성 인식·음성 출력은 계속 작동합니다)');
        } else if (e.message === 'UNAVAILABLE') {
          banner($('warn'), '해당 언어쌍(' + srcCode + '→en) 내장 모델을 지원하지 않습니다.');
        }
        render('');
      }
    });
  }

  /* ================= 음성 인식 ================= */
  function createRecognition() {
    const r = new SR();
    r.lang = $('lang').value;
    r.continuous = $('auto').checked;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => { recognizing = true; if (!ttsBusy) setStatus('듣는 중…', 'on'); };

    r.onresult = e => {
      if (ttsBusy) return;                      // 재생 중 들어온 결과는 버림(에코 차단)
      const srcCode = $('lang').selectedOptions[0].dataset.code;
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) {
          if (!txt) continue;
          const seg = { src: txt, dst: '', state: 'pending' };
          segments.push(seg);
          if ($('doTrans').checked) enqueueTranslate(seg, srcCode);
          else {
            seg.dst = txt; seg.state = 'done';
            if ($('autoSpeak').checked) speak(segments.length - 1);
          }
        } else interim += e.results[i][0].transcript;
      }
      render(interim);
    };

    r.onerror = e => {
      if (['no-speech', 'aborted'].includes(e.error)) return;
      banner($('err'), ({
        'not-allowed': '마이크 권한이 거부되었습니다. 주소창의 자물쇠 아이콘에서 허용해주세요.',
        'audio-capture': '마이크 장치를 찾을 수 없습니다.',
        'network': '음성 인식 네트워크 오류가 발생했습니다.'
      })[e.error] || ('오류: ' + e.error));
    };

    r.onend = () => {
      recognizing = false;
      if (ttsBusy) return;                      // 재생 중이면 재개는 TTS 종료 콜백이 담당
      if (!manualStop && sessionOn && $('auto').checked) { restartRecognition(); return; }
      setStatus('대기 중', '');
      $('startBtn').disabled = false;
      $('stopBtn').disabled = true;
    };
    return r;
  }

  function restartRecognition() {
    if (recognizing || ttsBusy || !sessionOn) return;
    recog = createRecognition();
    try { recog.start(); } catch (_) {}
  }

  /* ================= 버튼 ================= */
  $('startBtn').onclick = async () => {
    $('err').style.display = 'none';
    manualStop = false; sessionOn = true;
    if (TTS) { TTS.cancel(); loadVoices(); }   // 사용자 제스처 시점에 TTS 활성화
    if ($('doTrans').checked) {
      try { await ensureTranslator($('lang').selectedOptions[0].dataset.code); } catch (_) {}
    }
    restartRecognition();
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
  };

  $('stopBtn').onclick = () => {
    manualStop = true; sessionOn = false;
    if (recog) recog.stop();
    $('stopBtn').disabled = true;
    $('startBtn').disabled = false;
    setStatus('중지됨', '');
  };

  $('clearBtn').onclick = () => { stopSpeaking(); segments = []; render(''); };

  $('copyBtn').onclick = async () => {
    const text = segments.filter(s => s.state === 'done').map(s => s.dst).join('\n');
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      $('copyBtn').textContent = '복사됨!';
      setTimeout(() => $('copyBtn').textContent = '번역문 복사', 1200);
    } catch (_) {}
  };

  $('lang').onchange = () => {
    translator = null; translatorLang = null; $('engine').textContent = '—';
    if (recognizing) { try { recog.abort(); } catch (_) {} }
  };

  window.addEventListener('beforeunload', () => { if (TTS) TTS.cancel(); });

  if (!translatorAPI()) {
    banner($('warn'),
      '<b>이 브라우저에는 내장 번역 모델(Translator API)이 없습니다.</b><br>' +
      'Chrome 138+ 에서 <code>chrome://flags/#translation-api</code> → <b>Enabled</b> 후 재시작하면 사용할 수 있습니다. ' +
      '음성 인식·음성 출력은 지금도 동작합니다.');
    $('engine').textContent = '사용 불가';
  }
})();
</script>
</body>
</html>
