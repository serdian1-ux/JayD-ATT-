<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>음성 → 영어 번역 → 음성 출력 v3</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 16px; background: #0f1115; color: #e8eaed;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 1020px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .ver { font-size: 11px; color: #5c6personal; color: #6d7582; margin-bottom: 14px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .controls.sub { padding-top: 10px; border-top: 1px solid #242a34; margin-bottom: 12px; }
  button {
    padding: 11px 18px; border: 0; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; background: #2b6cf6; color: #fff;
  }
  button.stop { background: #d93b3b; }
  button.ghost { background: #2a2f3a; color: #cfd4dc; }
  button.sm { padding: 8px 12px; font-size: 13px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select, input[type=text] {
    padding: 10px; border-radius: 8px; border: 1px solid #333a47;
    background: #1a1e26; color: #e8eaed; font-size: 14px; max-width: 230px;
  }
  label.chk { font-size: 13px; color: #aab2bf; display: flex; align-items: center; gap: 6px; }
  .rng { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aab2bf; }
  input[type=range] { width: 88px; accent-color: #2b6cf6; }
  .tag { font-size: 11px; color: #6d7582; letter-spacing: .05em; text-transform: uppercase; }
  #status { font-size: 13px; margin-bottom: 12px; color: #8d96a3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: #35c759; animation: pulse 1.1s infinite; }
  .dot.speak { background: #f0a030; animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  #micState { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: #2a2f3a; color: #8d96a3; }
  #micState.live { background: #16321f; color: #6fdc8c; }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 {
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: #7f8795; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px;
  }
  .box {
    width: 100%; min-height: 160px; padding: 12px 16px;
    background: #1a1e26; border: 1px solid #2b313c; border-radius: 10px;
    font-size: 16px; line-height: 1.75; word-break: break-word;
    overflow-y: auto; max-height: 38vh; -webkit-overflow-scrolling: touch;
  }
  .box.trans { border-color: #2f4a6b; background: #161d26; }
  .interim { color: #7f8795; font-style: italic; }
  .pending { color: #6d7582; }
  .line { display: block; margin-bottom: 5px; }
  .line.speaking { background: #2a3a52; border-radius: 5px; box-shadow: 0 0 0 4px #2a3a52; }
  .play { display: inline-block; cursor: pointer; color: #5a85c9; margin-right: 7px; font-size: 15px; user-select: none; padding: 2px 4px; }
  .banner { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; display: none; line-height: 1.6; }
  .banner.err  { background: #3a1f22; border: 1px solid #6b2c31; color: #ffb4b4; }
  .banner.warn { background: #3a331f; border: 1px solid #6b5c2c; color: #ffe2a8; }
  .banner.info { background: #1b2a3a; border: 1px solid #2f4a6b; color: #a8cdff; }
  #diag { display: none; margin-bottom: 12px; padding: 10px 12px; background: #141922; border: 1px solid #2b313c; border-radius: 8px; font-size: 12.5px; line-height: 1.8; }
  #diag .ok { color: #6fdc8c; } #diag .ng { color: #ff9a9a; } #diag .wait { color: #8d96a3; }
  code { background: #11151c; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>음성 → 영어 번역 → 음성 출력</h1>
  <div class="ver">v3 · 모바일 원격번역 전용 경로 / 내장모델 미시도</div>

  <div class="banner err"  id="err"></div>
  <div class="banner warn" id="warn"></div>
  <div class="banner info" id="info"></div>
  <div id="diag"></div>
  <div id="bar" style="height:4px;background:#2a2f3a;border-radius:3px;overflow:hidden;display:none;margin-bottom:12px;"><i id="barFill" style="display:block;height:100%;width:0;background:#2b6cf6;transition:width .2s"></i></div>

  <div class="controls">
    <span class="tag">입력</span>
    <button id="startBtn">녹음 시작</button>
    <button id="stopBtn" class="stop" disabled>중지</button>
    <button id="clearBtn" class="ghost">지우기</button>
    <select id="lang">
      <option value="ko-KR" data-code="ko">한국어</option>
      <option value="ja-JP" data-code="ja">日本語</option>
      <option value="zh-CN" data-code="zh">中文</option>
      <option value="es-ES" data-code="es">Español</option>
    </select>
    <label class="chk"><input type="checkbox" id="auto" checked> 연속 인식</label>
    <label class="chk"><input type="checkbox" id="doTrans" checked> 영어 번역</label>
  </div>

  <div class="controls sub">
    <span class="tag">음성 출력</span>
    <label class="chk"><input type="checkbox" id="autoSpeak" checked> 자동 읽기</label>
    <select id="voice"><option>음성 로딩 중…</option></select>
    <span class="rng">속도 <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><b id="rateV">1.0</b></span>
    <span class="rng">음높이 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><b id="pitchV">1.0</b></span>
    <button id="speakAllBtn" class="ghost sm">전체 듣기</button>
    <button id="ttsStopBtn" class="ghost sm">읽기 중지</button>
    <button id="copyBtn" class="ghost sm">번역문 복사</button>
  </div>

  <div class="controls sub">
    <span class="tag">진단</span>
    <button id="testBtn" class="ghost sm">번역 엔진 점검</button>
    <button id="manualBtn" class="ghost sm">직접 입력 번역</button>
    <span style="font-size:12px;color:#6d7582">번역이 안 되면 먼저 눌러보세요</span>
  </div>

  <div id="status">
    <span class="dot" id="dot"></span><span id="statusText">대기 중</span>
    <span id="micState">마이크 꺼짐</span>
  </div>

  <div class="panes">
    <div class="pane">
      <h2><span>원문 (음성 인식)</span><span id="count">0자</span></h2>
      <div class="box" id="srcBox"></div>
    </div>
    <div class="pane">
      <h2><span>영어 번역 (▶ 터치 재생)</span><span id="engine">—</span></h2>
      <div class="box trans" id="dstBox"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const SR  = window.SpeechRecognition || window.webkitSpeechRecognition;
  const TTS = window.speechSynthesis;
  const $ = id => document.getElementById(id);
  const srcBox = $('srcBox'), dstBox = $('dstBox');

  const UA = navigator.userAgent;
  const IS_IOS     = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const IS_ANDROID = /Android/.test(UA);
  const IS_MOBILE  = IS_IOS || IS_ANDROID;

  let recog = null, recognizing = false, manualStop = false, sessionOn = false, startingRecog = false;
  let segments = [];
  let translator = null, translatorLang = null;
  let transQueue = Promise.resolve();
  let speakingIdx = -1, voices = [], ttsQueue = [], ttsBusy = false;
  let ttsUnlocked = false, wakeLock = null, micStream = null, suppressUntil = 0;
  let useBuiltin = !IS_MOBILE;          // ★ 모바일이면 내장 모델 아예 시도 안 함

  const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  const banner = (el, msg) => { el.style.display = 'block'; el.innerHTML = msg; };
  function setStatus(t, mode) { $('statusText').textContent = t; $('dot').className = 'dot' + (mode ? ' ' + mode : ''); }
  function setMicState(on) {
    const el = $('micState');
    el.textContent = on ? '마이크 점유 중' : '마이크 꺼짐';
    el.className = on ? 'live' : '';
  }

  function render(interim) {
    srcBox.innerHTML =
      segments.map(s => '<span class="line">' + esc(s.src) + '</span>').join('') +
      (interim ? '<span class="interim">' + esc(interim) + '</span>' : '');
    dstBox.innerHTML = segments.map((s, i) => {
      const cls = 'line' + (i === speakingIdx ? ' speaking' : '');
      if (s.state === 'done')
        return '<span class="' + cls + '"><span class="play" data-i="' + i + '">▶</span>' + esc(s.dst) + '</span>';
      if (s.state === 'fail')
        return '<span class="line pending">[번역 실패] ' + esc(s.src) + ' <span class="play" data-retry="' + i + '">↻ 재시도</span></span>';
      return '<span class="line pending">번역 중…</span>';
    }).join('');
    srcBox.scrollTop = srcBox.scrollHeight;
    dstBox.scrollTop = dstBox.scrollHeight;
    $('count').textContent = segments.reduce((a, s) => a + s.src.length, 0) + '자';
  }

  /* ===== 환경 점검 ===== */
  if (!SR) {
    banner($('err'), IS_IOS
      ? '<b>iOS 크롬/사파리는 음성 인식(Web Speech)을 지원하지 않습니다.</b><br>안드로이드 크롬이나 PC 크롬을 쓰세요. (번역·읽기 기능은 “직접 입력 번역”으로 사용 가능)'
      : '이 브라우저는 Web Speech API를 지원하지 않습니다.');
    $('startBtn').disabled = true;
  }
  const SECURE = location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname);
  if (!SECURE) {
    banner($('err'),
      '<b>HTTPS가 아닙니다.</b><br><code>http://</code>·<code>file://</code> 에서는 마이크 권한이 저장되지 않고, ' +
      '원격 번역 요청도 차단될 수 있습니다. 반드시 <code>https://</code> 로 접속하세요.');
  }

  /* ===== 마이크: 세션 내내 유지 ===== */
  async function acquireMic() {
    if (micStream && micStream.getAudioTracks().some(t => t.readyState === 'live')) return micStream;
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    setMicState(true);
    return micStream;
  }
  function releaseMic() { if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; } setMicState(false); }
  function muteMic(on) { if (micStream) micStream.getAudioTracks().forEach(t => { t.enabled = !on; }); }

  /* ===== TTS ===== */
  function loadVoices() {
    if (!TTS) return;
    const all = TTS.getVoices();
    let list = all.filter(v => /^en(-|_|$)/i.test(v.lang));
    if (!list.length) list = all;
    if (!list.length) return;
    voices = list;
    const sel = $('voice'), cur = sel.value;
    sel.innerHTML = voices.map((v, i) =>
      '<option value="' + i + '">' + v.name + ' (' + v.lang + ')' + (v.localService ? ' · 로컬' : '') + '</option>').join('');
    const pref = voices.findIndex(v => /natural|google|samantha|aria/i.test(v.name));
    sel.value = (cur && voices[cur]) ? cur : (pref >= 0 ? pref : 0);
  }
  if (TTS) {
    loadVoices(); TTS.onvoiceschanged = loadVoices;
    let n = 0; const iv = setInterval(() => { loadVoices(); if (voices.length || ++n > 20) clearInterval(iv); }, 250);
  }
  function unlockTTS() {
    if (ttsUnlocked || !TTS) return;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang='en-US'; TTS.speak(u); ttsUnlocked = true; } catch (_) {}
  }
  function speak(idx) { if (TTS && segments[idx] && segments[idx].state === 'done') { ttsQueue.push(idx); pumpTTS(); } }

  function pumpTTS() {
    if (ttsBusy || !ttsQueue.length) return;
    const idx = ttsQueue.shift(), seg = segments[idx];
    if (!seg || !seg.dst) return pumpTTS();
    ttsBusy = true; speakingIdx = idx; muteMic(true);

    const u = new SpeechSynthesisUtterance(seg.dst);
    const v = voices[$('voice').value];
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = parseFloat($('rate').value); u.pitch = parseFloat($('pitch').value);

    let done = false;
    const finish = () => {
      if (done) return; done = true; clearTimeout(guard);
      ttsBusy = false; speakingIdx = -1; suppressUntil = Date.now() + 450;
      muteMic(false); render('');
      if (ttsQueue.length) { setTimeout(pumpTTS, 80); return; }
      if (sessionOn && !manualStop) {
        if (recognizing) setStatus('듣는 중…', 'on'); else setTimeout(startRecognition, 200);
      } else setStatus('대기 중', '');
    };
    u.onstart = () => { setStatus('읽는 중…', 'speak'); render(''); };
    u.onend = finish; u.onerror = finish;
    const guard = setTimeout(finish, Math.max(4000, seg.dst.length * 120));
    TTS.cancel();
    setTimeout(() => { try { TTS.speak(u); } catch (_) { finish(); } }, 120);
  }

  function stopSpeaking() {
    ttsQueue = []; if (TTS) TTS.cancel();
    ttsBusy = false; speakingIdx = -1; suppressUntil = Date.now() + 300;
    muteMic(false); render('');
    if (sessionOn && !manualStop && !recognizing) setTimeout(startRecognition, 200);
  }

  dstBox.addEventListener('click', e => {
    const p = e.target.closest('.play');
    if (!p) return;
    if (p.dataset.retry !== undefined) {
      const i = +p.dataset.retry, seg = segments[i];
      seg.state = 'pending'; render('');
      enqueueTranslate(seg, $('lang').selectedOptions[0].dataset.code);
      return;
    }
    unlockTTS(); stopSpeaking(); speak(+p.dataset.i);
  });

  /* ================= 번역 ================= */
  function builtinAPI() {
    if (typeof Translator !== 'undefined' && Translator.availability) return Translator;
    if (self.ai && self.ai.translator) return self.ai.translator;
    return null;
  }
  async function ensureBuiltin(srcCode) {
    if (translator && translatorLang === srcCode) return translator;
    const API = builtinAPI();
    if (!API) throw new Error('UNSUPPORTED');
    const opts = { sourceLanguage: srcCode, targetLanguage: 'en' };
    const avail = await API.availability(opts);
    if (avail === 'unavailable') throw new Error('UNAVAILABLE');
    if (avail !== 'available') { $('bar').style.display = 'block'; setStatus('번역 모델 다운로드 중…',''); }
    translator = await API.create({ ...opts, monitor(m){ m.addEventListener('downloadprogress', e => {
      $('barFill').style.width = Math.round((e.loaded||0)*100) + '%'; }); } });
    $('bar').style.display = 'none'; translatorLang = srcCode;
    return translator;
  }

  async function httpGet(url, ms, asText) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort('timeout'), ms || 9000);
    try {
      const r = await fetch(url, { signal: ac.signal, mode: 'cors', credentials: 'omit', cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return asText ? await r.text() : await r.json();
    } finally { clearTimeout(t); }
  }

  const GTX = (text, src) =>
    'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + encodeURIComponent(src)
    + '&tl=en&dt=t&q=' + encodeURIComponent(text);

  // CORS 프록시 (직접 호출이 막혔을 때)
  const PROXIES = [
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
    u => 'https://thingproxy.freeboard.io/fetch/' + u
  ];

  function parseGtx(j) {
    const out = (j[0] || []).map(p => p[0]).filter(Boolean).join('');
    if (!out) throw new Error('empty');
    return out;
  }

  const PROVIDERS = [
    { id: 'gtx', label: 'Google gtx (직접)', async run(text, src) {
        return parseGtx(await httpGet(GTX(text, src))); } },

    { id: 'gtx-clients5', label: 'Google clients5', async run(text, src) {
        const u = 'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl='
          + encodeURIComponent(src) + '&tl=en&q=' + encodeURIComponent(text);
        const j = await httpGet(u);
        const out = Array.isArray(j) ? (Array.isArray(j[0]) ? j[0][0] : j[0]) : null;
        if (!out) throw new Error('empty');
        return String(out); } },

    { id: 'mymemory', label: 'MyMemory', async run(text, src) {
        const u = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text)
          + '&langpair=' + encodeURIComponent(src) + '|en&de=app@example.com';
        const j = await httpGet(u);
        const out = j && j.responseData && j.responseData.translatedText;
        if (!out || /MYMEMORY WARNING|INVALID/i.test(out)) throw new Error('empty');
        return out; } },

    { id: 'lingva-garuda', label: 'Lingva (garuda)', async run(text, src) {
        const u = 'https://lingva.garudalinux.org/api/v1/' + encodeURIComponent(src) + '/en/' + encodeURIComponent(text);
        const j = await httpGet(u);
        if (!j.translation) throw new Error('empty');
        return j.translation; } },

    { id: 'lingva-ml', label: 'Lingva (ml)', async run(text, src) {
        const u = 'https://lingva.ml/api/v1/' + encodeURIComponent(src) + '/en/' + encodeURIComponent(text);
        const j = await httpGet(u);
        if (!j.translation) throw new Error('empty');
        return j.translation; } },

    { id: 'proxy-gtx', label: 'Google gtx (프록시)', async run(text, src) {
        let last;
        for (const wrap of PROXIES) {
          try {
            const raw = await httpGet(wrap(GTX(text, src)), 11000, true);
            return parseGtx(JSON.parse(raw));
          } catch (e) { last = e; }
        }
        throw last || new Error('proxy fail'); } }
  ];

  let order = PROVIDERS.slice();
  let lastErrors = [];

  async function remoteTranslate(text, src) {
    lastErrors = [];
    for (let i = 0; i < order.length; i++) {
      const p = order[i];
      try {
        const out = await p.run(text, src);
        order = [p].concat(order.filter(x => x !== p));   // 성공한 엔진 우선
        $('engine').textContent = p.label;
        return out;
      } catch (e) {
        lastErrors.push(p.label + ': ' + (e && e.message ? e.message : e));
      }
    }
    throw new Error('ALL_FAILED');
  }

  async function translateText(text, srcCode) {
    if (useBuiltin) {
      try {
        const t = await ensureBuiltin(srcCode);
        $('engine').textContent = '내장 ' + srcCode + '→en';
        return await t.translate(text);
      } catch (e) {
        useBuiltin = false; $('bar').style.display = 'none';
        // ★ 더 이상 chrome://flags 안내 배너 띄우지 않음. 조용히 원격으로 전환
      }
    }
    return await remoteTranslate(text, srcCode);
  }

  function enqueueTranslate(seg, srcCode) {
    transQueue = transQueue.then(async () => {
      try {
        seg.dst = await translateText(seg.src, srcCode);
        seg.state = 'done'; render('');
        if ($('autoSpeak').checked) speak(segments.indexOf(seg));
      } catch (e) {
        seg.state = 'fail'; $('engine').textContent = '번역 실패';
        banner($('warn'),
          '<b>모든 번역 엔진이 실패했습니다.</b><br>' +
          '① 인터넷 연결 확인 ② <b>번역 엔진 점검</b> 버튼으로 어떤 엔진이 막혔는지 확인 ' +
          '③ 데이터 세이버·광고 차단·VPN·사내 와이파이가 외부 API를 막는지 확인<br>' +
          '<span style="font-size:12px;color:#c9a96a">' + esc(lastErrors.join(' / ')) + '</span>');
        render('');
      }
    });
  }

  /* ===== 진단 ===== */
  $('testBtn').onclick = async () => {
    const src = $('lang').selectedOptions[0].dataset.code;
    const sample = { ko: '안녕하세요', ja: 'こんにちは', zh: '你好', es: 'Hola' }[src] || '안녕하세요';
    const d = $('diag');
    d.style.display = 'block';
    d.innerHTML = '<b>번역 엔진 점검 (' + src + ' → en, "' + sample + '")</b><br>' +
      '내장 Translator API: ' + (builtinAPI() ? '<span class="ok">존재</span>' : '<span class="ng">없음 (모바일 크롬은 정상)</span>') + '<br>' +
      PROVIDERS.map(p => '<span id="t_' + p.id + '" class="wait">… ' + p.label + '</span>').join('<br>');
    for (const p of PROVIDERS) {
      const el = document.getElementById('t_' + p.id);
      try {
        const t0 = Date.now();
        const out = await p.run(sample, src);
        el.className = 'ok';
        el.textContent = '✔ ' + p.label + ' → "' + out + '" (' + (Date.now() - t0) + 'ms)';
        order = [p].concat(order.filter(x => x !== p));
      } catch (e) {
        el.className = 'ng';
        el.textContent = '✘ ' + p.label + ' — ' + (e && e.message ? e.message : e);
      }
    }
    d.innerHTML += '<br><span style="color:#8d96a3">✔ 가 하나라도 있으면 번역은 동작합니다. 전부 ✘ 면 네트워크/차단 문제입니다.</span>';
  };

  $('manualBtn').onclick = async () => {
    const text = prompt('번역할 문장을 입력하세요');
    if (!text) return;
    unlockTTS();
    const seg = { src: text.trim(), dst: '', state: 'pending' };
    segments.push(seg); render('');
    enqueueTranslate(seg, $('lang').selectedOptions[0].dataset.code);
  };

  /* ===== 음성 인식 ===== */
  function createRecognition() {
    const r = new SR();
    r.lang = $('lang').value;
    r.continuous = $('auto').checked;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => { recognizing = true; startingRecog = false; if (!ttsBusy) setStatus('듣는 중…', 'on'); };

    r.onresult = e => {
      if (ttsBusy || Date.now() < suppressUntil) return;
      const srcCode = $('lang').selectedOptions[0].dataset.code;
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = (e.results[i][0].transcript || '').trim();
        if (e.results[i].isFinal) {
          if (!txt) continue;
          const seg = { src: txt, dst: '', state: 'pending' };
          segments.push(seg);
          if ($('doTrans').checked) enqueueTranslate(seg, srcCode);
          else { seg.dst = txt; seg.state = 'done'; if ($('autoSpeak').checked) speak(segments.length - 1); }
        } else interim += e.results[i][0].transcript;
      }
      render(interim);
    };

    r.onerror = e => {
      if (['no-speech', 'aborted'].includes(e.error)) return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        sessionOn = false; releaseMic();
        $('startBtn').disabled = false; $('stopBtn').disabled = true;
      }
      banner($('err'), ({
        'not-allowed': '마이크 권한이 거부되었습니다. 주소창 왼쪽 아이콘 → 권한 → 마이크 → <b>허용</b>.',
        'service-not-allowed': '음성 인식 서비스가 차단되었습니다.',
        'audio-capture': '마이크 장치를 찾을 수 없습니다.',
        'network': '음성 인식 네트워크 오류입니다.'
      })[e.error] || ('오류: ' + e.error));
    };

    r.onend = () => {
      recognizing = false; startingRecog = false;
      if (ttsBusy) return;
      if (!manualStop && sessionOn && $('auto').checked) { setTimeout(startRecognition, 150); return; }
      setStatus('대기 중', '');
      $('startBtn').disabled = false; $('stopBtn').disabled = true;
    };
    return r;
  }

  function startRecognition() {
    if (recognizing || startingRecog || ttsBusy || !sessionOn) return;
    startingRecog = true;
    recog = createRecognition();
    try { recog.start(); }
    catch (_) { startingRecog = false; setTimeout(() => { if (!recognizing && sessionOn) startRecognition(); }, 400); }
  }

  async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {} }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (_) {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && sessionOn) { requestWakeLock(); if (!recognizing && !ttsBusy) startRecognition(); }
  });

  /* ===== 버튼 ===== */
  $('startBtn').onclick = async () => {
    $('err').style.display = 'none'; $('warn').style.display = 'none';
    manualStop = false; sessionOn = true;
    unlockTTS(); if (TTS) loadVoices(); requestWakeLock();
    try { await acquireMic(); }
    catch (err) {
      sessionOn = false; releaseWakeLock();
      banner($('err'), '<b>마이크를 사용할 수 없습니다.</b> (' + (err && err.name || 'error') + ')<br>사이트 권한에서 마이크를 허용해주세요.');
      return;
    }
    if ($('doTrans').checked && useBuiltin) {
      try { await ensureBuiltin($('lang').selectedOptions[0].dataset.code); } catch (_) { useBuiltin = false; }
    }
    startRecognition();
    $('startBtn').disabled = true; $('stopBtn').disabled = false;
  };

  $('stopBtn').onclick = () => {
    manualStop = true; sessionOn = false;
    ttsQueue = []; if (TTS) TTS.cancel(); ttsBusy = false; speakingIdx = -1;
    if (recog) { try { recog.stop(); } catch (_) {} }
    releaseMic(); releaseWakeLock();
    $('stopBtn').disabled = true; $('startBtn').disabled = false;
    setStatus('중지됨', ''); render('');
  };

  $('clearBtn').onclick = () => { stopSpeaking(); segments = []; render(''); };
  $('rate').oninput  = e => $('rateV').textContent  = parseFloat(e.target.value).toFixed(1);
  $('pitch').oninput = e => $('pitchV').textContent = parseFloat(e.target.value).toFixed(1);
  $('speakAllBtn').onclick = () => { unlockTTS(); stopSpeaking(); segments.forEach((s,i)=>{ if(s.state==='done') ttsQueue.push(i); }); pumpTTS(); };
  $('ttsStopBtn').onclick = stopSpeaking;

  $('copyBtn').onclick = async () => {
    const text = segments.filter(s => s.state === 'done').map(s => s.dst).join('\n');
    if (!text) return;
    try { await navigator.clipboard.writeText(text); }
    catch (_) {
      const ta = document.createElement('textarea'); ta.value = text;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (__) {}
      document.body.removeChild(ta);
    }
    $('copyBtn').textContent = '복사됨!';
    setTimeout(() => $('copyBtn').textContent = '번역문 복사', 1200);
  };

  $('lang').onchange = () => {
    translator = null; translatorLang = null; $('engine').textContent = '—';
    if (recognizing && recog) { try { recog.stop(); } catch (_) {} }
  };

  window.addEventListener('beforeunload', () => { if (TTS) TTS.cancel(); releaseMic(); releaseWakeLock(); });

  // 시작 안내
  if (IS_MOBILE) {
    banner($('info'),
      '<b>모바일 모드</b> — 크롬 내장 번역 모델은 데스크톱 전용이라 이 기기에서는 <b>원격 번역 API</b>를 사용합니다. ' +
      '인터넷 연결이 필요하며, 번역이 안 되면 상단 <b>번역 엔진 점검</b> 을 눌러보세요.');
    $('engine').textContent = '원격 대기';
  }
})();
</script>
</body>
</html>
